# Configuration du bot d'actualités.
# Les secrets (token Telegram, clé API) ne vont JAMAIS ici : ils passent par des
# variables d'environnement (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, ANTHROPIC_API_KEY).

timezone: Asia/Shanghai          # heure de Chine (UTC+8)

digest:
  hour: 21                       # heure du résumé du soir (heure locale)
  max_par_categorie: 10          # nombre d'infos par catégorie dans le résumé
  score_min: 2                   # on ignore les infos notées 1 dans le résumé

alertes:
  seuil_urgent: 4                # note >= 4 : notification immédiate
  seuil_fil: 3                   # note >= 3 : publiée en silence dans l'onglet de sa catégorie (mode "onglets")
  max_par_heure: 6               # garde-fou anti-spam
  age_max_heures: 3              # on n'alerte pas sur un article publié il y a plus de 3 h
  nuit: {debut: 23, fin: 7}      # la nuit, seules les infos notées 5 réveillent
  fil_sans_onglets: false        # true = en conversation privée, envoie aussi les notes 3 (en silencieux)

# Analyse par IA (facultative). Sans ANTHROPIC_API_KEY, le bot utilise uniquement
# les mots-clés ci-dessous. Avec la clé, Claude note chaque info de 1 à 5,
# corrige les catégories, traduit les titres en français et rédige le résumé du soir.
llm:
  model: claude-opus-5-5         # claude-haiku-5-5 coûte environ 40 fois moins cher, voir README
  effort: low

